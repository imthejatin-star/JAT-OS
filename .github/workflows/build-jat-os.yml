name: Build JAT OS Android Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/launcher/**'
      - '.github/workflows/build-jat-os.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android/launcher
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JAT-OS-Android-Launcher
          path: android/launcher/app/build/outputs/apk/debug/app-debug.apk
